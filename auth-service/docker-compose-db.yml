services:
  auth-service-db:
    image: postgres:15
    container_name: auth-service-db
    restart: always
    ports:
      - "5001:5432"   # optional (only if you want DB access from host)
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true

volumes:
  auth_db_data:
